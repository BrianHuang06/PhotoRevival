[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-revival"
version = "0.1.0"
description = "Old photo restoration system based on SDXL, LoRA, SwinIR, and a Flask API."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate",
    "diffusers",
    "flask",
    "flask-cors",
    "numpy",
    "opencv-python",
    "peft",
    "pillow",
    "safetensors",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "timm",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]
